{% extends "labs/base.html" %}
{% block title %}Change portal password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <h1>Change portal password</h1>
  <p class="muted">This changes only your password for this portal. Your SSH / Node-RED / MQTT / database password is not changed.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary">Change</button></form>
</div>
{% endblock %}
