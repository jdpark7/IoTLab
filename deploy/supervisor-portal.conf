; /etc/supervisor/conf.d/belajarhub_portal.conf
[program:portal_web]
command=/opt/belajarhub-portal/deploy/run.sh web
user=belajarhub
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/belajarhub/web.log
stderr_logfile=/var/log/belajarhub/web.err

[program:portal_worker]
command=/opt/belajarhub-portal/deploy/run.sh worker
user=belajarhub
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/belajarhub/worker.log
stderr_logfile=/var/log/belajarhub/worker.err
