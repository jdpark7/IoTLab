# /etc/nginx/conf.d/portal.conf
server {
    listen 80;
    server_name portal.belajarhub.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.belajarhub.id;

    ssl_certificate     /etc/letsencrypt/live/belajarhub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belajarhub.id/privkey.pem;

    client_max_body_size 2m;
    access_log /var/log/nginx/portal_access.log;
    error_log  /var/log/nginx/portal_error.log;

    location /static/ {
        alias /opt/belajarhub-portal/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/belajarhub/portal.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
